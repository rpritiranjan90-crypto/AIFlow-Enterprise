---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers
  labels:
    app: workers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workers
  template:
    metadata:
      labels:
        app: workers
    spec:
      containers:
      - name: workers
        image: ghcr.io/enterprise/aiflow-backend:latest
        imagePullPolicy: Always
        command: ["celery", "-A", "app.worker.celery", "worker", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: aiflow-config
        - secretRef:
            name: aiflow-secrets
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        lifecycle:
          preStop:
            exec:
              # Give the workers time to finish the currently active jobs
              command: ["celery", "control", "shutdown"]

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workers-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workers
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
