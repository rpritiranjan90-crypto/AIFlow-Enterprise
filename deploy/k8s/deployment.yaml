apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiflow-backend
  namespace: aiflow-production
  labels:
    app: aiflow-backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aiflow-backend
  template:
    metadata:
      labels:
        app: aiflow-backend
    spec:
      containers:
      - name: backend
        image: registry.aiflow.enterprise.io/aiflow-backend:v1.0.0
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: aiflow-config
        - secretRef:
            name: aiflow-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /api/v1/admin/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/admin/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aiflow-backend-hpa
  namespace: aiflow-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aiflow-backend
  minReplicas: 4
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiflow-ingress
  namespace: aiflow-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - app.aiflow.enterprise.io
    secretName: aiflow-tls-cert
  rules:
  - host: app.aiflow.enterprise.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aiflow-backend-svc
            port:
              number: 8000
