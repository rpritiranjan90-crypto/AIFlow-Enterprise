version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: aiflow_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - aiflow_network

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: aiflow_frontend
    restart: always
    environment:
      - VITE_API_URL=http://backend:8000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aiflow_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aiflow_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://aiflow_user:aiflow_secure_pass_2026@postgres:5432/aiflow_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=aiflow_enterprise_jwt_master_secret_key_2026
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiflow_network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiflow_postgres
    restart: always
    environment:
      - POSTGRES_DB=aiflow_db
      - POSTGRES_USER=aiflow_user
      - POSTGRES_PASSWORD=aiflow_secure_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiflow_user -d aiflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiflow_network

  redis:
    image: redis:7-alpine
    container_name: aiflow_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiflow_network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: aiflow_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aiflow_network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: aiflow_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_secure_pass_2026
    volumes:
      - ./monitoring/grafana-dashboards.json:/var/lib/grafana/dashboards/dashboards.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aiflow_network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: aiflow_alertmanager
    restart: always
    ports:
      - "9093:9093"
    networks:
      - aiflow_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  aiflow_network:
    driver: bridge
