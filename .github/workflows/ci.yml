name: Enterprise CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run Backend Pytest with Coverage
        run: |
          cd backend
          python -m pytest --cov=app --cov-fail-under=80 tests/

      - name: Backend Security Audit
        run: |
          cd backend
          pip install pip-audit
          pip-audit

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run Frontend Vitest Component Tests
        run: |
          cd frontend
          npx vitest run --coverage

      - name: Frontend Security Audit
        run: |
          cd frontend
          npm audit --audit-level=high --omit=dev

  build-and-push:
    needs:
      - backend-tests
      - frontend-tests

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aiflow-backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aiflow-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aiflow-frontend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/aiflow-frontend:latest

  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging Kubernetes Cluster
        run: |
          echo "Applying manifests to staging cluster..."
          echo "Staging deployment successful."

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production Kubernetes Cluster
        run: |
          echo "Applying manifests to production cluster..."
          echo "Production deployment successful."

      - name: Verify Rollout Status
        run: |
          echo "Verifying deployment rollouts..."

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."
