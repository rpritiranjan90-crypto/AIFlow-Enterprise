name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: enterprise/aiflow

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio httpx
    - name: Run Backend Pytest with Coverage
      run: |
        cd backend
        python -m pytest --cov=app --cov-fail-under=80 tests/
    - name: Backend Security Audit
      run: |
        cd backend
        pip install pip-audit
        pip-audit

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "20"
    - name: Install dependencies
      run: |
        cd frontend
        npm install
    - name: Run Frontend Vitest Component Tests
      run: |
        cd frontend
        npx vitest run --coverage
    - name: Frontend Security Audit
      run: |
        cd frontend
        npm audit --audit-level=high --omit=dev

  build-and-push:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v3
    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
        
    - name: Build and push Frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}

  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - uses: actions/checkout@v3
    - name: Deploy to Staging Kubernetes Cluster
      run: |
        # In a real environment, you would use a tool like Helm or Kustomize
        # and authenticate with the Kubernetes cluster using a kubeconfig secret
        echo "Applying manifests to staging cluster..."
        # kubectl apply -k deploy/k8s/ --dry-run=client
        echo "Staging deployment successful."

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: 
      name: production
      # This requires manual approval setup in GitHub Repository Environments
    steps:
    - uses: actions/checkout@v3
    - name: Deploy to Production Kubernetes Cluster
      run: |
        echo "Applying manifests to production cluster..."
        # kubectl apply -k deploy/k8s/ --dry-run=client
        echo "Production deployment successful."
    - name: Verify Rollout Status
      run: |
        echo "Verifying deployment rollouts..."
        # kubectl rollout status deployment/backend -n production
        # kubectl rollout status deployment/frontend -n production
    - name: Rollback on Failure
      if: failure()
      run: |
        echo "Deployment failed. Rolling back..."
        # kubectl rollout undo deployment/backend -n production
        # kubectl rollout undo deployment/frontend -n production
