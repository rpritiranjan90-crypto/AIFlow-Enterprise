services:
  - type: web
    name: aiflow-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "PYTHONPATH=backend gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
